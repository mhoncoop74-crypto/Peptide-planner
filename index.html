<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Peptide Planner</title><style>
:root{--b:#f5f7fb;--c:#fff;--t:#17202a;--m:#667085;--l:#e4e7ec;--a:#2563eb;--g:#067647;--w:#b54708}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--b);color:var(--t)}header{background:#101828;color:#fff;padding:20px 16px 16px;position:sticky;top:0;z-index:2}h1{font-size:23px;margin:0}header p{margin:4px 0 0;color:#cbd5e1;font-size:13px}main{max-width:850px;margin:auto;padding:14px 13px 80px}.tabs{display:flex;gap:7px;overflow:auto}.btn,.tabs button{border:1px solid var(--l);background:#fff;border-radius:11px;padding:10px 12px;font-weight:700;white-space:nowrap}.tabs .on,.primary{background:var(--a)!important;color:#fff;border-color:var(--a)!important}.card{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:14px;margin:10px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}h2{font-size:18px;margin:17px 2px 8px}h3{margin:0 0 5px;font-size:16px}.muted,.mini{color:var(--m);font-size:12px}.dose{font-size:20px;font-weight:800}.pill{font-size:11px;font-weight:700;padding:5px 8px;border-radius:99px;background:#ecfdf3;color:var(--g)}.planned{background:#f2f4f7;color:#475467}.progress{height:8px;background:#eaecf0;border-radius:8px;margin:10px 0;overflow:hidden}.progress i{display:block;height:100%;background:var(--a)}.day{padding:11px 0;border-bottom:1px solid var(--l)}.day:last-child{border:0}.hidden{display:none}.notice{border-left:4px solid #f79009}.cyclebox{margin-top:14px;padding:12px;border:1px solid var(--l);border-radius:13px;background:#f8fafc}.cyclebox strong{font-size:13px}.cyclegrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.cyclegrid div{font-size:12px;color:var(--m)}.history{margin-top:12px;padding-top:10px;border-top:1px solid var(--l)}.historyline{display:flex;justify-content:space-between;font-size:12px;padding:5px 0}.liveDose{font-size:18px;font-weight:800;color:var(--a);padding:9px 0}.foot{font-size:11px;color:var(--m);margin-top:22px}label{display:block;font-size:12px;color:var(--m);margin:10px 0 4px}input,select{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:10px;font-size:16px;background:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.days label{text-align:center;margin:0}.days input{width:auto}.modal{position:fixed;inset:0;background:#0008;z-index:9;display:flex;align-items:flex-end}.modal.hidden{display:none}.sheet{background:#fff;width:100%;max-width:850px;max-height:92vh;overflow:auto;margin:auto;padding:17px;border-radius:20px 20px 0 0}.actions{display:flex;gap:8px;margin-top:14px}.actions button{flex:1}@media(min-width:700px){.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal{align-items:center}.sheet{border-radius:20px}.card{margin:5px 0}}
</style></head><body><header><h1>Peptide Planner</h1><p id="date"></p></header><main><div class="tabs"><button class="on" data-x="today">Vandaag</button><button data-x="week">Week</button><button data-x="peptides">Peptides</button><button data-x="alerts">Meldingen</button></div><section id="today"></section><section id="week" class="hidden"></section><section id="peptides" class="hidden"></section><section id="alerts" class="hidden"></section><div class="card"><div class="row"><div><strong>Gegevensbeheer</strong><div class="mini">Gebruik herstel alleen als oude lokale gegevens blijven staan.</div></div><button class="btn" onclick="resetData()">Herstel</button></div></div><p class="foot">Persoonlijke planner · gegevens worden lokaal in deze browser bewaard · geen medisch advies.</p></main><div id="modal" class="modal hidden"><div class="sheet"><div class="row"><h2>Aanpassen</h2><button class="btn" onclick="closeM()">Sluiten</button></div><div id="form"></div></div></div><script>
const D=["zo","ma","di","wo","do","vr","za"],DN=["Zondag","Maandag","Dinsdag","Woensdag","Donderdag","Vrijdag","Zaterdag"],seed=[{id:"r",name:"Retatrutide",active:1,start:"2026-06-11",cw:24,rw:0,vm:10,bm:1,u:30,days:[0],hist:[{date:"2026-06-11",u:25},{date:"2026-09-13",u:30}]},{id:"t",name:"Tesamorelin",active:1,start:"2026-09-02",cw:12,rw:4,vm:10,bm:3,u:15,days:[0,1,2,3,4,5,6],check:1,hist:[]},{id:"g",name:"GHK-Cu",active:1,start:"2026-08-23",cw:12,rw:4,vm:50,bm:3,u:6,days:[0,1,2,3,4,5,6],check:1,hist:[]},{id:"s",name:"SS-31",active:0,start:"",cw:6,rw:4,vm:50,bm:2,u:0,days:[0,1,2,3,4,5,6],hist:[]},{id:"m",name:"MOTS-c",active:0,start:"",cw:6,rw:4,vm:40,bm:2,u:0,days:[1,3,5],hist:[]},{id:"e",name:"Epitalon",active:0,start:"",cw:3,rw:4,vm:50,bm:2,u:20,days:[0,1,2,3,4,5,6],hist:[]}];const DATA_VERSION=3;let a=JSON.parse(localStorage.getItem("pepplanner")||"null")||seed;function migrate(){let v=+(localStorage.getItem("pepplanner-version")||0);if(v<3){let by=Object.fromEntries(a.map(x=>[x.id,x]));seed.forEach(s=>{if(!by[s.id])a.push(structuredClone(s));else{let p=by[s.id];["cw","rw","days","vm","bm"].forEach(k=>{if(p[k]===undefined)p[k]=s[k]})}});localStorage.setItem("pepplanner-version",DATA_VERSION);localStorage.setItem("pepplanner",JSON.stringify(a))}}migrate();
// One-time data migration for corrected cycle start dates.
const MIGRATION_KEY="pepplanner_migration_20260918_dates_v1";
if(!localStorage.getItem(MIGRATION_KEY)){
  const corrected={r:"2026-06-11",t:"2026-09-02",g:"2026-08-23"};
  a.forEach(p=>{
    if(corrected[p.id]) p.start=corrected[p.id];
    if(p.id==="r"&&Array.isArray(p.hist)){
      p.hist=p.hist.map(h=>h.date==="2026-05-24"?{...h,date:"2026-06-11"}:h);
    }
  });
  localStorage.setItem("pepplanner",JSON.stringify(a));
  localStorage.setItem(MIGRATION_KEY,"1");
}
const ps=s=>new Date(s+"T12:00:00"),iso=d=>{let x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")},add=(s,n)=>{let d=ps(s);d.setDate(d.getDate()+n);return iso(d)},fmt=s=>s?ps(s).toLocaleDateString("nl-NL",{day:"numeric",month:"short",year:"numeric"}):"—",mg=(p,u=p.u)=>p.vm&&p.bm?u*p.vm/(p.bm*100):0,timeOf=p=>p.time||(p.id==="r"||p.id==="e"?"Avond":"Ochtend");
function cyc(p){if(!p.start)return null;let end=add(p.start,p.cw*7-1),next=add(end,p.rw*7+1),now=new Date();now.setHours(12,0,0,0);let dd=Math.floor((now-ps(p.start))/864e5);return{end,next,w:Math.max(1,Math.floor(dd/7)+1),rem:Math.max(0,Math.floor((ps(end)-now)/864e5)+1),pct:Math.min(100,Math.max(0,(dd+1)/(p.cw*7)*100))}}function units(p,s){let h=(p.hist||[]).filter(x=>x.date<=s).sort((x,y)=>x.date.localeCompare(y.date));return h.length?h[h.length-1].u:p.u}function due(p,s){if(!p.active||!p.start||s<p.start)return 0;let c=cyc(p);return s<=c.end&&p.days.includes(ps(s).getDay())}function alerts(p){let c=cyc(p);if(!c)return[];let z=[{d:add(c.end,-6),t:p.name+": laatste cyclusweek begint"},{d:c.end,t:p.name+": laatste cyclusdag"}];if(p.rw>0)z.push({d:add(c.next,-7),t:p.name+": over 1 week nieuwe cyclus"},{d:add(c.next,-1),t:p.name+": morgen nieuwe cyclus"});return z}
function save(){localStorage.setItem("pepplanner",JSON.stringify(a));localStorage.setItem("pepplanner-version",DATA_VERSION);render()}function resetData(){if(confirm("Lokale plannergegevens vervangen door de actuele standaardgegevens?")){a=structuredClone(seed);localStorage.setItem("pepplanner",JSON.stringify(a));localStorage.setItem("pepplanner-version",DATA_VERSION);render();alert("Plannergegevens zijn hersteld.")}}function render(){let now=new Date(),s=iso(now);date.textContent=now.toLocaleDateString("nl-NL",{weekday:"long",day:"numeric",month:"long",year:"numeric"});let td=a.filter(p=>due(p,s));today.innerHTML="<h2>Vandaag</h2><div class=cards>"+(td.map(p=>{let u=units(p,s),c=cyc(p);return '<div class=card><div class=row><div><h3>'+p.name+'</h3><span class=pill>week '+c.w+' / '+p.cw+'</span></div><div class=dose>'+u+' U</div></div><div class=muted>'+mg(p,u).toFixed(2)+' mg · '+timeOf(p)+' · t/m '+fmt(c.end)+'</div><div class=progress><i style=width:'+c.pct+'%></i></div><div class=mini>'+c.rem+' dagen resterend</div></div>'}).join("")||"<div class=card>Vandaag niets gepland.</div>")+"</div>";let mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7));let w="<h2>Deze week</h2><div class=card>";for(let i=0;i<7;i++){let d=new Date(mon);d.setDate(mon.getDate()+i);let x=iso(d),it=a.filter(p=>due(p,x));w+='<div class=day><strong>'+DN[d.getDay()]+' · '+fmt(x)+'</strong><div class=mini>'+(it.map(p=>{let u=units(p,x);return p.name+" · "+u+" U · "+mg(p,u).toFixed(2)+" mg · "+timeOf(p)}).join("<br>")||"Geen planning")+"</div></div>"}week.innerHTML=w+"</div>";peptides.innerHTML='<div class=row><h2>Peptides</h2><button class="btn primary" onclick=addP()>+ Toevoegen</button></div><div class=cards>'+a.map(p=>{let c=cyc(p);return '<div class=card onclick="edit(\''+p.id+'\')"><div class=row><h3>'+p.name+'</h3><span class="pill '+(!p.active?"planned":"")+'">'+(p.active?"Actief":"Gepland")+'</span></div><div class=dose>'+p.u+' U <span class=muted>= '+mg(p).toFixed(2)+' mg</span></div><div class=mini>Moment: '+timeOf(p)+' · Start '+fmt(p.start)+' · cyclus '+p.cw+' wk · rust '+p.rw+' wk</div>'+(p.check?'<div class=mini style=color:#b54708>Startdatum/concentratie controleren</div>':"")+(c?'<div class=mini>Einde '+fmt(c.end)+' · herstart '+fmt(c.next)+'</div>':"")+"</div>"}).join("")+"</div>";let al=a.flatMap(alerts).sort((x,y)=>x.d.localeCompare(y.d));alerts.innerHTML="<h2>Meldingen</h2>"+al.map(x=>'<div class="card notice"><strong>'+fmt(x.d)+'</strong><div class=mini>'+x.t+"</div></div>").join("")}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(q=>q.classList.remove("on"));b.classList.add("on");["today","week","peptides","alerts"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!==b.dataset.x))});
function edit(id){let p=a.find(x=>x.id===id);modal.classList.remove("hidden");let cc=cyc(p),hh=(p.hist||[]).slice().sort((x,y)=>y.date.localeCompare(x.date));form.innerHTML='<label>Naam</label><input id=n value="'+p.name+'"><div class=grid><div><label>Startdatum cyclus</label><input id=st type=date value="'+p.start+'"></div><div><label>Status</label><select id=ac><option value=1 '+(p.active?"selected":"")+'>Actief</option><option value=0 '+(!p.active?"selected":"")+'>Gepland</option></select></div><div><label>Cyclus (weken)</label><input id=cw type=number min=1 value="'+p.cw+'"></div><div><label>Rustperiode (weken)</label><input id=rw type=number min=0 value="'+p.rw+'"></div><div><label>Vial (mg)</label><input id=vm type=number step=.1 value="'+p.vm+'"></div><div><label>Vloeistof (ml)</label><input id=bm type=number step=.1 value="'+p.bm+'"></div><div><label>Dosis (U-100 units)</label><input id=uu type=number step=.5 value="'+p.u+'"></div><div><label>Berekende dosis</label><div id=liveMg class=liveDose>'+mg(p).toFixed(2)+' mg</div></div></div><label>Moment van de dag</label><select id=tm><option value="Ochtend" '+(timeOf(p)==="Ochtend"?"selected":"")+'>Ochtend</option><option value="Avond" '+(timeOf(p)==="Avond"?"selected":"")+'>Avond</option></select><label>Injectiedagen</label><div class=days>'+D.map((d,i)=>'<label>'+d+'<br><input class=dy type=checkbox value='+i+' '+(p.days.includes(i)?"checked":"")+'></label>').join("")+'</div><div id=cyclePreview class=cyclebox>'+(cc?'<strong>Cyclusplanning</strong><div class=cyclegrid><div>Huidige week<br><b>'+cc.w+' van '+p.cw+'</b></div><div>Laatste cyclusdag<br><b>'+fmt(cc.end)+'</b></div><div>Rustperiode<br><b>'+p.rw+' weken</b></div><div>Volgende cyclus<br><b>'+fmt(cc.next)+'</b></div></div>':'<span class=mini>Vul een startdatum in om de cyclusplanning te zien.</span>')+'</div><div class=history><strong>Dosisgeschiedenis</strong>'+(hh.length?hh.map(x=>'<div class=historyline><span>'+fmt(x.date)+'</span><b>'+x.u+' U · '+mg(p,x.u).toFixed(2)+' mg</b></div>').join(''):'<div class=mini style="margin-top:6px">Nog geen dosiswijzigingen opgeslagen.</div>')+'</div><div class=actions><button class=btn onclick=closeM()>Annuleren</button><button class="btn primary" onclick="apply(\''+p.id+'\')">Opslaan</button></div>';["uu","vm","bm","st","cw","rw"].forEach(x=>document.getElementById(x).addEventListener("input",livePreview));livePreview()}
function livePreview(){let U=+uu.value,V=+vm.value,B=+bm.value;liveMg.textContent=(V&&B?U*V/(B*100):0).toFixed(2)+" mg";if(!st.value){cyclePreview.innerHTML="<span class=mini>Vul een startdatum in om de cyclusplanning te zien.</span>";return}let tmp={start:st.value,cw:+cw.value||1,rw:+rw.value||0},cc=cyc(tmp);cyclePreview.innerHTML="<strong>Cyclusplanning</strong><div class=cyclegrid><div>Huidige week<br><b>"+cc.w+" van "+tmp.cw+"</b></div><div>Laatste cyclusdag<br><b>"+fmt(cc.end)+"</b></div><div>Rustperiode<br><b>"+tmp.rw+" weken</b></div><div>Volgende cyclus<br><b>"+fmt(cc.next)+"</b></div><div>Laatste week<br><b>"+fmt(add(cc.end,-6))+"</b></div><div>1 week voor herstart<br><b>"+fmt(add(cc.next,-7))+"</b></div><div>Laatste dag<br><b>"+fmt(cc.end)+"</b></div><div>1 dag voor herstart<br><b>"+fmt(add(cc.next,-1))+"</b></div></div>"}
function apply(id){let p=a.find(x=>x.id===id),nu=+uu.value;if(nu!==p.u){p.hist=p.hist||[];p.hist.push({date:iso(new Date()),u:nu})}p.name=n.value;p.start=st.value;p.active=ac.value==="1";p.cw=+cw.value;p.rw=+rw.value;p.vm=+vm.value;p.bm=+bm.value;p.u=nu;p.time=tm.value;p.days=[...document.querySelectorAll(".dy:checked")].map(x=>+x.value);p.check=0;closeM();save()}function closeM(){modal.classList.add("hidden")}function addP(){let id="p"+Date.now();a.push({id,name:"Nieuw peptide",active:0,start:"",cw:8,rw:4,vm:10,bm:2,u:0,days:[1],hist:[]});save();edit(id)}render();
</script></body></html>
